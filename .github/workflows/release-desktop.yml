name: Release VoiceLab Desktop

# Publishes installers for macOS (arm64 + x64) and Linux (x64) to
# github.com/voicelab-uz/desktop releases. Windows is currently disabled until
# a Windows Authenticode certificate is configured.
# electron-updater reads the platform metadata from those releases.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Apple code signing and notarization
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          test -n "$APPLE_CERTIFICATE_BASE64" || {
            echo "Missing GitHub secret: APPLE_CERTIFICATE_BASE64"
            exit 1
          }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || {
            echo "Missing GitHub secret: APPLE_CERTIFICATE_PASSWORD"
            exit 1
          }
          test -n "$APPLE_API_KEY_BASE64" || {
            echo "Missing GitHub secret: APPLE_API_KEY_BASE64"
            exit 1
          }
          test -n "$APPLE_API_KEY_ID" || {
            echo "Missing GitHub secret: APPLE_API_KEY_ID"
            exit 1
          }
          test -n "$APPLE_API_ISSUER" || {
            echo "Missing GitHub secret: APPLE_API_ISSUER"
            exit 1
          }
          test -n "$APPLE_TEAM_ID" || {
            echo "Missing GitHub secret: APPLE_TEAM_ID"
            exit 1
          }

          certificate_path="$RUNNER_TEMP/voicelab-developer-id.p12"
          api_key_path="$RUNNER_TEMP/voicelab-notary-key.p8"
          keychain_path="$RUNNER_TEMP/voicelab-signing.keychain-db"
          keychain_password="voicelab-ci-keychain"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"
          echo "Voicelab signing identities:"
          security find-identity -v -p codesigning "$keychain_path" | tee "$RUNNER_TEMP/signing-identities.txt"
          grep -q "Developer ID Application" "$RUNNER_TEMP/signing-identities.txt" || {
            echo "The imported certificate is not a Developer ID Application certificate"
            exit 1
          }

      - name: Install ffmpeg-static for target architecture
        if: matrix.arch == 'x64'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: macos-${{ matrix.arch }}-bin-${{ hashFiles('scripts/download-*.js', 'scripts/build-*.js') }}

      - name: Compile native helpers
        run: |
          npm run compile:globe -- --arch ${{ matrix.arch }}
          npm run compile:fast-paste -- --arch ${{ matrix.arch }}
          npm run compile:media-remote -- --arch ${{ matrix.arch }}
          npm run compile:audio-tap -- --arch ${{ matrix.arch }}
          npm run compile:mic-listener
          npm run compile:text-monitor

      - name: Download bundled binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          node scripts/download-whisper-cpp.js --current --platform darwin --arch ${{ matrix.arch }}
          node scripts/download-llama-server.js --current --platform darwin --arch ${{ matrix.arch }}
          node scripts/download-sherpa-onnx.js --current --platform darwin --arch ${{ matrix.arch }}
          node scripts/download-yt-dlp.js --current --platform darwin --arch ${{ matrix.arch }}
          node scripts/download-qdrant.js --current --platform darwin --arch ${{ matrix.arch }}
          node scripts/download-meeting-aec-helper.js --current --platform darwin --arch ${{ matrix.arch }} || true
          node scripts/download-whisper-vad-model.js || true

      - name: Create release .env (no shared AISHA key)
        run: |
          cat > .env <<'EOF'
          VITE_AUTH_URL=https://voicelab.uz
          VITE_AUTH_API_URL=https://api.voicelab.uz
          VITE_VOICELAB_API_URL=https://back.aisha.group
          AISHA_API_KEY=
          OPENWHISPR_PROTOCOL=voicelab
          VITE_OPENWHISPR_PROTOCOL=voicelab
          UI_LANGUAGE=uz
          EOF
          # Strip accidental leading spaces from indented heredoc lines
          sed -i '' 's/^[[:space:]]*//' .env

      - name: Build and publish macOS ${{ matrix.arch }}
        run: |
          npm run build:renderer
          # Arch-specific channel → latest-arm64-mac.yml / latest-x64-mac.yml
          # (matches src/updater.js; default "latest" races on latest-mac.yml)
          npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=true \
            electron-builder --mac --${{ matrix.arch }} --publish always \
            -c.publish.channel=latest-${{ matrix.arch }} \
            -c.mac.forceCodeSigning=true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          UPDATE_OWNER: voicelab-uz
          UPDATE_REPO: desktop

          # electron-builder selects the imported Developer ID Application
          # identity from the temporary keychain and notarizes with the API key.
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify signed and notarized app
        run: |
          set -euo pipefail
          app_path="$(find dist -type d -name 'VoiceLab.app' -print -quit)"
          test -n "$app_path" || { echo "VoiceLab.app was not found in dist/"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier='
          xcrun stapler validate "$app_path"

      - name: Clean up Apple signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/voicelab-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/voicelab-developer-id.p12" "$RUNNER_TEMP/voicelab-notary-key.p8"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install platform-specific native packages
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: linux-x64-bin-${{ hashFiles('scripts/download-*.js', 'scripts/build-*.js') }}

      - name: Download bundled binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          node scripts/download-whisper-cpp.js --current --platform linux --arch x64
          node scripts/download-llama-server.js --current --platform linux --arch x64
          node scripts/download-sherpa-onnx.js --current --platform linux --arch x64
          node scripts/download-yt-dlp.js --current --platform linux --arch x64
          node scripts/download-qdrant.js --current --platform linux --arch x64
          node scripts/download-meeting-aec-helper.js --current --platform linux --arch x64 || true
          node scripts/download-whisper-vad-model.js || true
          node scripts/download-diarization-models.js --output-dir resources/bin/diarization-models || true

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libx11-dev libxtst-dev libatspi2.0-dev libglib2.0-dev libpipewire-0.3-dev pkg-config

      - name: Create release environment
        run: |
          cat > .env <<'EOF'
          VITE_AUTH_URL=https://voicelab.uz
          VITE_AUTH_API_URL=https://api.voicelab.uz
          VITE_VOICELAB_API_URL=https://back.aisha.group
          AISHA_API_KEY=
          OPENWHISPR_PROTOCOL=voicelab
          VITE_OPENWHISPR_PROTOCOL=voicelab
          UI_LANGUAGE=uz
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Verify Linux system audio helper
        run: |
          npm run compile:linux-system-audio
          resources/bin/linux-system-audio-helper probe | grep '"supportsNativeCapture":true'

      - name: Build and publish Linux
        run: npm run build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          UPDATE_OWNER: voicelab-uz
          UPDATE_REPO: desktop

  build-windows:
    # Re-enable by setting the repository variable ENABLE_WINDOWS_RELEASE=true
    if: ${{ vars.ENABLE_WINDOWS_RELEASE == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Windows code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "Missing GitHub secret: WINDOWS_CERTIFICATE_BASE64"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Missing GitHub secret: WINDOWS_CERTIFICATE_PASSWORD"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "voicelab-code-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "WIN_CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install platform-specific native packages
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: windows-x64-bin-${{ hashFiles('scripts/download-*.js', 'resources/windows-system-audio-helper.c') }}

      - name: Download bundled binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          node scripts/download-whisper-cpp.js --current --platform win32 --arch x64
          node scripts/download-llama-server.js --current --platform win32 --arch x64
          node scripts/download-sherpa-onnx.js --current --platform win32 --arch x64
          node scripts/download-yt-dlp.js --current --platform win32 --arch x64
          node scripts/download-qdrant.js --current --platform win32 --arch x64
          node scripts/download-meeting-aec-helper.js --current --platform win32 --arch x64 || true
          node scripts/download-nircmd.js
          node scripts/download-windows-fast-paste.js
          node scripts/download-windows-key-listener.js
          node scripts/download-windows-mic-listener.js
          node scripts/download-windows-system-audio-helper.js
          node scripts/download-whisper-vad-model.js || true
          node scripts/download-diarization-models.js --output-dir resources/bin/diarization-models || true

      - name: Create release environment
        shell: pwsh
        run: |
          @(
            "VITE_AUTH_URL=https://voicelab.uz",
            "VITE_AUTH_API_URL=https://api.voicelab.uz",
            "VITE_VOICELAB_API_URL=https://back.aisha.group",
            "AISHA_API_KEY=",
            "OPENWHISPR_PROTOCOL=voicelab",
            "VITE_OPENWHISPR_PROTOCOL=voicelab",
            "UI_LANGUAGE=uz"
          ) | Set-Content -Path .env

      - name: Build and publish Windows
        run: npm run build:win -- --publish always -c.win.forceCodeSigning=true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          UPDATE_OWNER: voicelab-uz
          UPDATE_REPO: desktop
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify signed Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "uninstaller" } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "No Windows installer was found in dist/"
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Windows installer signature is $($signature.Status): $($signature.StatusMessage)"
          }

      - name: Clean up Windows signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_PATH) {
            Remove-Item -Force -ErrorAction SilentlyContinue $env:WINDOWS_CERTIFICATE_PATH
          }
